; SparkFun MicroMod STM32F405 (ATP carrier), STM32duino, USB CDC serial.
; Build:   pio run -e f405 -t upload
[env:f405]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
    -std=gnu++17
build_src_filter = +<*> -<LinuxI2cBus.cpp>
lib_extra_dirs = .
