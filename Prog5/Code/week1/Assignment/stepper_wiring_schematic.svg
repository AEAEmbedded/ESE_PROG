<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .box   { fill: #fafafa; stroke: #222; stroke-width: 1.6; }
    .title { font-size: 15px; font-weight: bold; }
    .pin   { font-size: 12px; }
    .wire  { fill: none; stroke-width: 2; stroke-linejoin: round; }
    .sig   { stroke: #1f5fbf; }
    .v5    { stroke: #d62828; }
    .gnd   { stroke: #222; }
    .a     { stroke: #2a9d3f; }
    .b     { stroke: #e08a00; }
    .vm    { stroke: #d62828; }
    .opt   { stroke-dasharray: 6 4; }
    .note  { font-size: 12px; fill: #333; }
    .lbl   { font-size: 11px; fill: #555; }
  </style>

  <text x="20" y="30" class="title" font-size="18">Typical stepper wiring for Prog 5 assignment 1 (Arduino Uno + TB6600 + bipolar NEMA 17)</text>

  <!-- Arduino -->
  <rect x="40" y="80" width="180" height="330" rx="6" class="box"/>
  <text x="130" y="105" text-anchor="middle" class="title">Arduino Uno</text>
  <text x="130" y="122" text-anchor="middle" class="lbl">(powered via USB)</text>
  <g class="pin" text-anchor="end">
    <text x="212" y="144">5V</text>
    <text x="212" y="174">D7</text>
    <text x="212" y="214">D6</text>
    <text x="212" y="254">D5</text>
    <text x="212" y="334">D12</text>
    <text x="212" y="384">GND</text>
  </g>
  <g fill="#222">
    <circle cx="220" cy="140" r="3"/><circle cx="220" cy="170" r="3"/><circle cx="220" cy="210" r="3"/>
    <circle cx="220" cy="250" r="3"/><circle cx="220" cy="330" r="3"/><circle cx="220" cy="380" r="3"/>
  </g>

  <!-- TB6600 -->
  <rect x="380" y="80" width="190" height="400" rx="6" class="box"/>
  <text x="475" y="105" text-anchor="middle" class="title">TB6600 driver</text>
  <text x="475" y="122" text-anchor="middle" class="lbl">opto-isolated inputs</text>
  <g class="pin">
    <text x="388" y="144">PUL+</text>
    <text x="388" y="174">DIR+</text>
    <text x="388" y="204">ENA+</text>
    <text x="388" y="254">PUL-</text>
    <text x="388" y="284">DIR-</text>
    <text x="388" y="314">ENA-</text>
  </g>
  <g class="pin" text-anchor="end">
    <text x="562" y="144">A+</text>
    <text x="562" y="174">A-</text>
    <text x="562" y="214">B+</text>
    <text x="562" y="244">B-</text>
    <text x="562" y="404">VCC</text>
    <text x="562" y="434">GND</text>
  </g>
  <g fill="#222">
    <circle cx="380" cy="140" r="3"/><circle cx="380" cy="170" r="3"/><circle cx="380" cy="200" r="3"/>
    <circle cx="380" cy="250" r="3"/><circle cx="380" cy="280" r="3"/><circle cx="380" cy="310" r="3"/>
    <circle cx="570" cy="140" r="3"/><circle cx="570" cy="170" r="3"/><circle cx="570" cy="210" r="3"/><circle cx="570" cy="240" r="3"/>
    <circle cx="570" cy="400" r="3"/><circle cx="570" cy="430" r="3"/>
  </g>
  <text x="475" y="350" text-anchor="middle" class="lbl">DIP SW1-3: microsteps (1/16)</text>
  <text x="475" y="366" text-anchor="middle" class="lbl">DIP SW4-6: current = motor rating</text>

  <!-- Motor -->
  <rect x="700" y="80" width="190" height="200" rx="6" class="box"/>
  <text x="795" y="105" text-anchor="middle" class="title">NEMA 17 stepper</text>
  <text x="795" y="122" text-anchor="middle" class="lbl">bipolar, 4 wires, 200 steps/rev</text>
  <g class="pin">
    <text x="708" y="135" font-size="11">A+</text>
    <text x="708" y="165" font-size="11">A-</text>
    <text x="708" y="205" font-size="11">B+</text>
    <text x="708" y="235" font-size="11">B-</text>
  </g>
  <g fill="#222">
    <circle cx="700" cy="140" r="3"/><circle cx="700" cy="170" r="3"/><circle cx="700" cy="210" r="3"/><circle cx="700" cy="240" r="3"/>
  </g>
  <!-- coil symbols -->
  <path d="M740 140 h20 a7 7 0 0 1 0 15 a7 7 0 0 1 0 15 h-20" fill="none" stroke="#2a9d3f" stroke-width="2"/>
  <path d="M740 210 h20 a7 7 0 0 1 0 15 a7 7 0 0 1 0 15 h-20" fill="none" stroke="#e08a00" stroke-width="2"/>
  <line x1="700" y1="140" x2="740" y2="140" stroke="#2a9d3f" stroke-width="2"/>
  <line x1="700" y1="170" x2="740" y2="170" stroke="#2a9d3f" stroke-width="2"/>
  <line x1="700" y1="210" x2="740" y2="210" stroke="#e08a00" stroke-width="2"/>
  <line x1="700" y1="240" x2="740" y2="240" stroke="#e08a00" stroke-width="2"/>
  <text x="790" y="160" class="lbl">coil A</text>
  <text x="790" y="230" class="lbl">coil B</text>
  <circle cx="850" cy="190" r="22" fill="none" stroke="#222" stroke-width="1.6"/>
  <text x="850" y="195" text-anchor="middle" font-size="14" font-weight="bold">M</text>

  <!-- Power supply -->
  <rect x="700" y="370" width="190" height="90" rx="6" class="box"/>
  <text x="812" y="392" text-anchor="middle" class="title">Motor power supply</text>
  <text x="812" y="452" text-anchor="middle" class="lbl">12-24 V DC, 2 A or more</text>
  <g class="pin">
    <text x="708" y="404" fill="#d62828">V+</text>
    <text x="708" y="434">GND</text>
  </g>
  <g fill="#222"><circle cx="700" cy="400" r="3"/><circle cx="700" cy="430" r="3"/></g>

  <!-- 5V common positive bus -->
  <path class="wire v5" d="M220 140 H340 V200 M340 140 H380 M340 170 H380 M340 200 H380"/>
  <g fill="#d62828"><circle cx="340" cy="140" r="3.5"/><circle cx="340" cy="170" r="3.5"/></g>

  <!-- signal wires -->
  <path class="wire sig" d="M220 170 H310 V250 H380"/>
  <path class="wire sig" d="M220 210 H290 V280 H380"/>
  <path class="wire sig" d="M220 250 H270 V310 H380"/>
  <text x="240" y="164" class="lbl" fill="#1f5fbf">STEP</text>
  <text x="240" y="204" class="lbl" fill="#1f5fbf">DIR</text>
  <text x="240" y="244" class="lbl" fill="#1f5fbf">ENA</text>

  <!-- optional limit switch -->
  <path class="wire sig opt" d="M220 330 H300 V520 H330"/>
  <path class="wire gnd opt" d="M220 380 H260 V560 H330"/>
  <line x1="330" y1="520" x2="330" y2="560" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="330" y1="522" x2="352" y2="548" stroke="#222" stroke-width="2"/>
  <circle cx="330" cy="520" r="3" fill="#222"/><circle cx="330" cy="560" r="3" fill="#222"/>
  <text x="360" y="536" class="lbl">optional limit switch / sensor</text>
  <text x="360" y="551" class="lbl">(pinMode INPUT_PULLUP, closes to GND)</text>

  <!-- motor phase wires -->
  <path class="wire a" d="M570 140 H700"/>
  <path class="wire a" d="M570 170 H700"/>
  <path class="wire b" d="M570 210 H700"/>
  <path class="wire b" d="M570 240 H700"/>

  <!-- motor supply wires -->
  <path class="wire vm" d="M570 400 H700"/>
  <path class="wire gnd" d="M570 430 H700"/>

  <!-- Notes -->
  <g class="note">
    <text x="40" y="600" font-weight="bold">Notes</text>
    <text x="40" y="620">1. Active-low wiring (SimpleStepper default): Arduino 5V to PUL+/DIR+/ENA+, STEP/DIR/ENA to the "-" inputs. ENA LOW = motor enabled.</text>
    <text x="40" y="640">2. Active-high alternative: signals to the "+" inputs and Arduino GND to PUL-/DIR-/ENA-. Then ENA HIGH = enabled.</text>
    <text x="40" y="660">3. Step pulse at least 5 us HIGH; set DIR at least 20 us before the first step. 200 steps x 16 microsteps = 3200 steps per revolution.</text>
    <text x="40" y="680">4. Never connect or disconnect the motor while the supply is on. Set DIP SW4-6 to the motor's rated current.</text>
    <text x="40" y="700">5. Finding the coil pairs: the two wires of one coil show a low resistance (a few ohms) on a multimeter.</text>
  </g>
</svg>
